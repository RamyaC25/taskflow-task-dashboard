
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Task Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>TaskFlow</h1>
        <p>Manage your tasks, achieve your goals.</p>
    </header>

    <main class="container">
        <section class="task-form">
            <h2>Add New Task</h2>
            <form id="taskForm">
                <input type="text" id="title" placeholder="Enter task title" required>
                <textarea id="description" placeholder="Enter task description"></textarea>
                <select id="status">
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                </select>
                <button type="submit">Add Task</button>
            </form>
        </section>

        <section class="task-list">
            <h2>My Tasks</h2>
            <div id="tasks">
                Loading tasks...
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
